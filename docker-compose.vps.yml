# Ajedrez en el VPS, detrás del Caddy compartido (deploy/caddy).
#   docker compose -f docker-compose.vps.yml up -d --build
# No publica puertos: se une a la red externa "web" (docker network create web).
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: ajedrez-server
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      # Tope de partidas en memoria (por defecto 50000, demasiado para 1 GB de RAM).
      MAX_GAMES: 3000
    networks:
      web:
        aliases: [ajedrez-server]
    cpus: 0.4
    mem_limit: 1536m
    memswap_limit: 1536m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  static:
    build:
      context: .
      dockerfile: deploy/static.Dockerfile
    container_name: ajedrez-static
    restart: unless-stopped
    networks:
      web:
        aliases: [ajedrez-static]
    cpus: 0.1
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  web:
    external: true
