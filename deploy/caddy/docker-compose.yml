# Caddy compartido: ÚNICO servicio que publica puertos en el VPS (solo el 443).
# Cloudflare (proxy + certificado de origen) conecta siempre por HTTPS: el 80 no se publica.
# Cada juego es otro proyecto compose en la red externa "web" y aporta su bloque en conf/sites/.
#   docker compose up -d
# Añadir o cambiar un sitio, sin cortar conexiones (nunca reiniciar el contenedor):
#   docker exec caddy caddy reload --config /etc/caddy/conf/Caddyfile
# conf/ se monta como DIRECTORIO a propósito: un fichero montado suelto deja de verse
# si se edita con `sed -i` o con un editor (crean otro inode) y el reload no cambia nada.
services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # origin = certificado de origen de Cloudflare · internal = autofirmado (pruebas)
      TLS_MODE: ${TLS_MODE:-origin}
      GOMEMLIMIT: 200MiB
    command: caddy run --config /etc/caddy/conf/Caddyfile --adapter caddyfile
    volumes:
      - ./conf:/etc/caddy/conf:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
