<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Juega al ajedrez online gratis y sin registro: partidas rápidas, retos con amigos y partidas contra la máquina." />
    <!-- Vista previa al compartir enlaces (también los de partidas, que no ejecutan JavaScript). -->
    <meta property="og:site_name" content="DameJaque" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="DameJaque · Ajedrez online gratis y sin registro" />
    <meta property="og:description" content="Partidas rápidas por ritmo, retos con amigos por enlace y partidas contra la máquina. Sin registro." />
    <meta property="og:image" content="https://damejaque.online/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DameJaque, ajedrez online" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="application-name" content="DameJaque" />
    <meta name="apple-mobile-web-app-title" content="DameJaque" />
    <meta name="theme-color" content="#eceef2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b2130" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- Fuente propia (variable, subconjunto latino): sin peticiones a terceros. -->
    <link rel="preload" href="%sveltekit.assets%/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
